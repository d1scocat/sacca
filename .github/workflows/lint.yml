name: Lint & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install project dependencies
      run: |
        uv pip install -e .[dev]

    - name: Ruff lint check
      run: |
        ruff check src tests
